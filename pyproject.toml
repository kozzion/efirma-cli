[project]
name = "efirma-cli"
version = "0.1.0"
description = "Unofficial command-line client for the Bulgarian accounting platform efirma.bg"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaap Oosterbroek" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["efirma", "bulgaria", "accounting", "invoicing", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Bulgarian",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
efirma = "efirma_cli.cli:app"

[project.urls]
Homepage = "https://github.com/kozzion/efirma-cli"
Repository = "https://github.com/kozzion/efirma-cli"
Issues = "https://github.com/kozzion/efirma-cli/issues"
"API notes" = "https://github.com/kozzion/efirma-cli/blob/main/docs/efirma-api-notes.md"

[tool.poetry]
packages = [{ include = "efirma_cli" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
